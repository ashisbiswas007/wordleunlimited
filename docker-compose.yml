# Coolify: point the resource at this repo and select "Docker Compose".
# Coolify injects the domain + generates the Traefik labels itself, so no
# ports/labels are hardcoded here beyond the container port.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SITE_URL: ${SITE_URL:-https://wordleunlimited.dev}
      DATABASE_URL: postgres://wordle:${POSTGRES_PASSWORD}@db:5432/wordle
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USER: ${ADMIN_USER:-admin}
      # Set ADMIN_PASSWORD to whatever you want to log in with — it is hashed at
      # boot and never stored in the clear. Leave both blank and one is generated
      # on first boot and printed to this container's logs.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      TRUST_PROXY: "1"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wordle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wordle
    volumes:
      - wordle-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordle -d wordle"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  wordle-db:
